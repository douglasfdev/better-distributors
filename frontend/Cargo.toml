[package]
name = "distributor-web"
version = "0.1.0"
edition = "2021"

[dependencies]
leptos = { version = "0.8", features = ["csr"] }
distributor-model = { path = "../shared" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
gloo-net = "0.6"
gloo-events = "0.2"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = { version = "0.3", features = ["Window", "CustomEvent", "Event", "HtmlInputElement"] }
futures = { version = "0.3", default-features = false, features = ["std"] }
qrcode = { version = "0.12", default-features = false, features = ["svg"] }
regex = "1"
console_error_panic_hook = "0.1"
